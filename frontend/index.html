<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CryptoAI — Login</title>
    <meta name="description" content="Login to your CryptoAI dashboard — Your smart crypto assistant for market insights, trends, and education.">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body class="auth-page">

    <!-- Animated background -->
    <div class="auth-bg">
        <div class="orb orb-1"></div>
        <div class="orb orb-2"></div>
        <div class="orb orb-3"></div>
        <div class="particles" id="particles"></div>
    </div>

    <div class="auth-container">
        <div class="auth-card" id="login-card">
            <!-- Logo -->
            <div class="auth-logo">
                <i class="fa-brands fa-bitcoin"></i>
            </div>
            <h1 class="auth-title">Welcome Back</h1>
            <p class="auth-subtitle">Sign in to your Crypto AI dashboard</p>

            <div id="login-alert" class="alert hidden"></div>

            <form id="login-form" novalidate>
                <div class="form-group">
                    <label for="login-email">Email Address</label>
                    <div class="input-wrap">
                        <i class="fa-solid fa-envelope input-icon"></i>
                        <input type="email" id="login-email" placeholder="you@example.com" required autocomplete="email">
                    </div>
                </div>
                <div class="form-group">
                    <label for="login-password">Password</label>
                    <div class="input-wrap">
                        <i class="fa-solid fa-lock input-icon"></i>
                        <input type="password" id="login-password" placeholder="Enter your password" required autocomplete="current-password">
                        <button type="button" class="toggle-pass" onclick="togglePassword('login-password', this)" aria-label="Toggle password visibility">
                            <i class="fa-solid fa-eye"></i>
                        </button>
                    </div>
                </div>

                <button type="submit" class="btn-primary" id="login-btn" data-label="Sign In">
                    <span class="btn-text">Sign In</span>
                    <i class="fa-solid fa-arrow-right"></i>
                </button>
            </form>

            <div class="auth-divider"><span>New here?</span></div>
            <p class="auth-switch">
                Don't have an account? <a href="register.html" id="go-register">Create one free →</a>
            </p>

            <!-- Quick demo credentials hint -->
            <div class="demo-hint">
                <i class="fa-solid fa-circle-info"></i>
                Register a new account to get started instantly
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
