<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CryptoAI — Create Account</title>
    <meta name="description" content="Create your free CryptoAI account and start exploring the crypto world with AI-powered insights.">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body class="auth-page">

    <div class="auth-bg">
        <div class="orb orb-1"></div>
        <div class="orb orb-2"></div>
        <div class="orb orb-3"></div>
    </div>

    <div class="auth-container">
        <div class="auth-card">
            <div class="auth-logo">
                <i class="fa-solid fa-rocket"></i>
            </div>
            <h1 class="auth-title">Get Started</h1>
            <p class="auth-subtitle">Create your free Crypto AI account</p>

            <div id="register-alert" class="alert hidden"></div>

            <form id="register-form" novalidate>
                <div class="form-group">
                    <label for="reg-email">Email Address</label>
                    <div class="input-wrap">
                        <i class="fa-solid fa-envelope input-icon"></i>
                        <input type="email" id="reg-email" placeholder="you@example.com" required autocomplete="email">
                    </div>
                </div>
                <div class="form-group">
                    <label for="reg-password">Password</label>
                    <div class="input-wrap">
                        <i class="fa-solid fa-lock input-icon"></i>
                        <input type="password" id="reg-password" placeholder="Minimum 6 characters" required autocomplete="new-password">
                        <button type="button" class="toggle-pass" onclick="togglePassword('reg-password', this)" aria-label="Toggle password">
                            <i class="fa-solid fa-eye"></i>
                        </button>
                    </div>
                </div>
                <div class="form-group">
                    <label for="reg-confirm">Confirm Password</label>
                    <div class="input-wrap">
                        <i class="fa-solid fa-shield-halved input-icon"></i>
                        <input type="password" id="reg-confirm" placeholder="Repeat your password" required autocomplete="new-password">
                        <button type="button" class="toggle-pass" onclick="togglePassword('reg-confirm', this)" aria-label="Toggle confirm password">
                            <i class="fa-solid fa-eye"></i>
                        </button>
                    </div>
                </div>

                <!-- Password strength indicator -->
                <div class="pw-strength" id="pw-strength">
                    <div class="pw-bar" id="pw-bar"></div>
                </div>
                <p class="pw-label" id="pw-label"></p>

                <button type="submit" class="btn-primary" id="register-btn" data-label="Create Account">
                    <span class="btn-text">Create Account</span>
                    <i class="fa-solid fa-arrow-right"></i>
                </button>
            </form>

            <div class="auth-divider"><span>Already registered?</span></div>
            <p class="auth-switch">
                Already have an account? <a href="index.html">Sign in →</a>
            </p>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
